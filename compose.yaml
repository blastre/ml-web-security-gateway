services:
  gateway:
    build: .
    user: "${MLWSG_UID:-1000}:${MLWSG_GID:-1000}"
    command: ["uv", "run", "--no-sync", "uvicorn", "mlwsg.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MLWSG_DB: /state/incidents.sqlite
      MLWSG_MODEL: /models/model.joblib
      MLWSG_APP: http://vuln-app:8000
      MLWSG_AGENT_BACKEND: ${MLWSG_AGENT_BACKEND:-offline}
      MLWSG_AGENT_SENSITIVITY: ${MLWSG_AGENT_SENSITIVITY:-balanced}
      MLWSG_AGENT_MEMORY: /state/agent_memory.sqlite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./artifacts/models:/models:ro
      - ./artifacts:/state
    ports:
      - "127.0.0.1:9100:8000"
    networks: [front, edge]
    depends_on: [vuln-app]

  vuln-app:
    build: .
    command: ["uv", "run", "--no-sync", "uvicorn", "mlwsg.testbed:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MLWSG_SERVICE: app
      MLWSG_ENABLE_UNSAFE_FETCH: "1"
      SSL_CERT_FILE: /app/lab-certs/redirect.crt
    networks:
      front: {}
      public: {}
      internal: {}
      metadata: {}

  metadata-sim:
    build: .
    command: ["uv", "run", "--no-sync", "uvicorn", "mlwsg.testbed:app", "--host", "0.0.0.0", "--port", "80"]
    environment: {MLWSG_SERVICE: metadata}
    networks:
      metadata:
        ipv4_address: 169.254.169.254
        aliases: [metadata.google.internal, rebind.attacker.lab]

  internal-svc:
    build: .
    command: ["uv", "run", "--no-sync", "uvicorn", "mlwsg.testbed:app", "--host", "0.0.0.0", "--port", "80"]
    environment: {MLWSG_SERVICE: internal}
    networks:
      internal:
        ipv4_address: 10.10.0.10
        aliases: [intranet.attacker.lab]

  public-svc:
    build: .
    command: ["uv", "run", "--no-sync", "uvicorn", "mlwsg.testbed:app", "--host", "0.0.0.0", "--port", "80"]
    environment: {MLWSG_SERVICE: public}
    networks:
      public:
        ipv4_address: 10.20.0.20
        aliases: [public.lab]

  redirect-svc:
    build: .
    command: ["uv", "run", "--no-sync", "python", "-m", "mlwsg.redirect_server"]
    environment: {MLWSG_SERVICE: redirect}
    networks:
      public:
        ipv4_address: 10.20.0.30
        aliases: [redirect.attacker.lab]

networks:
  edge: {}
  front:
    internal: true
    ipam:
      config: [{subnet: 10.21.0.0/24}]
  public:
    internal: true
    ipam:
      config: [{subnet: 10.20.0.0/24}]
  internal:
    internal: true
    ipam:
      config: [{subnet: 10.10.0.0/24}]
  metadata:
    internal: true
    ipam:
      config: [{subnet: 169.254.169.0/24}]
