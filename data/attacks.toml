payload = "http://%31%36%39.254.169.254/computeMetadata/v1/"
asset = "metadata"
resolves_to = "169.254.169.254"
layers = ["inbound", "egress"]

[[attacks]]
id = "A14"
technique = "Userinfo confusion"
vector = "literal"
payload = "http://trusted.example@10.10.0.10/admin"
asset = "internal"
resolves_to = "10.10.0.10"
layers = ["inbound", "egress"]

[[attacks]]
id = "A15"
technique = "Parser differential (backslash before @)"
vector = "parser"
payload = "http://10.10.0.10\\@trusted.example/admin"
asset = "internal"
resolves_to = "10.10.0.10"
layers = ["inbound", "egress"]
note = "urllib.parse reads trusted.example; WHATWG parsers read 10.10.0.10"

[[attacks]]
id = "A16"
technique = "Private IPv4 literal"
vector = "literal"
payload = "http://10.10.0.10/admin"
asset = "internal"
resolves_to = "10.10.0.10"
layers = ["inbound", "egress"]

[[attacks]]
id = "A17"
technique = "Attacker domain resolving to private IP"
vector = "dns"
payload = "http://intranet.attacker.lab/admin"
asset = "internal"
resolves_to = "10.10.0.10"
layers = ["egress"]

[[attacks]]
id = "A18"
technique = "DNS rebinding"
vector = "dns"
payload = "http://rebind.attacker.lab/computeMetadata/v1/"
asset = "metadata"
resolves_to = "169.254.169.254"
layers = ["egress"]
note = "First answer is public (passes inbound checks), second answer is the metadata IP"

[[attacks]]
id = "A19"
technique = "Open redirect to metadata"
vector = "redirect"
payload = "http://redirect.attacker.lab/r?to=http://169.254.169.254/computeMetadata/v1/"
asset = "metadata"
resolves_to = "169.254.169.254"
layers = ["egress"]

[[attacks]]
id = "A20"
technique = "Redirect with scheme downgrade"
vector = "redirect"
payload = "https://redirect.attacker.lab/r?to=http://10.10.0.11:6379/"
asset = "internal"
resolves_to = "10.10.0.11"
layers = ["egress"]

[[attacks]]
id = "A21"
technique = "file:// scheme"
vector = "scheme"
payload = "file:///etc/passwd"
asset = "filesystem"
layers = ["inbound"]

[[attacks]]
id = "A22"
technique = "gopher:// to Redis"
vector = "scheme"
payload = "gopher://10.10.0.11:6379/_INFO%0D%0A"
asset = "internal"
resolves_to = "10.10.0.11"
layers = ["inbound", "egress"]
