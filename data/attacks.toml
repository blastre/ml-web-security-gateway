# Phase 1 attack catalogue. See docs/threat_model.md for the meaning of each field.
# `payload` is the value of the vulnerable `url` parameter as the application receives it.
# `resolves_to` is the address the application finally connects to inside the lab.

[assets.metadata]
description = "Emulated cloud metadata/credential services holding dummy secrets (AWS, GCP, Azure, Oracle, Alibaba, DigitalOcean, Hetzner, ECS)"
networks = [
  "169.254.169.254/32",  # AWS/GCP/Azure/DigitalOcean/Hetzner IMDS
  "fd00:ec2::254/128",   # AWS IMDS over IPv6
  "169.254.170.2/32",    # AWS ECS/Fargate task-credentials endpoint
  "192.0.0.192/32",      # Oracle Cloud Infrastructure metadata
  "100.100.100.200/32",  # Alibaba Cloud metadata
]

[assets.internal]
description = "Private lab services (admin panel, Redis-like store)"
networks = ["10.10.0.0/24"]

[assets.loopback]
description = "Services bound to the application container's own loopback"
networks = ["127.0.0.0/8", "::1/128", "0.0.0.0/32"]

[assets.filesystem]
description = "Local files of the application container"
networks = []

[[attacks]]
id = "A01"
technique = "Metadata IPv4 literal"
vector = "literal"
payload = "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token"
asset = "metadata"
resolves_to = "169.254.169.254"
layers = ["inbound", "egress"]

[[attacks]]
id = "A02"
technique = "Metadata AWS IMDSv1 path"
vector = "literal"
payload = "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
asset = "metadata"
resolves_to = "169.254.169.254"
layers = ["inbound", "egress"]

[[attacks]]
id = "A03"
technique = "Metadata hostname"
vector = "dns"
payload = "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token"
asset = "metadata"
resolves_to = "169.254.169.254"
layers = ["inbound", "egress"]

[[attacks]]
id = "A04"
