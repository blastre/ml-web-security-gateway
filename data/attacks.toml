technique = "Parser differential (backslash before @)"
vector = "parser"
payload = "http://10.10.0.10\\@trusted.example/admin"
asset = "internal"
resolves_to = "10.10.0.10"
layers = ["inbound", "egress"]
note = "urllib.parse reads trusted.example; WHATWG parsers read 10.10.0.10"

[[attacks]]
id = "A16"
