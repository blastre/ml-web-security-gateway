[project]
name = "ssrf-agent"
version = "0.1.0"
description = "POC: SSRF detection agent based on the IDS-Agent architecture"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "joblib>=1.6.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "tldextract>=5.4.0",
    "typer>=0.27.3",
]

[project.scripts]
ssrf-agent = "ssrf_agent.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
