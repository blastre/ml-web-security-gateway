[project]
name = "ml-web-security-gateway"
version = "0.1.0"
description = "Hybrid ML web security gateway for SSRF and cloud metadata attacks (research prototype)"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mlwsg = "mlwsg.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mlwsg"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
